name: Deploy dev (FTP)

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_SHOW_DRAFTS: "1"
      - name: Upload via lftp (retries on flaky passive ports)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          sudo apt-get install -y lftp >/dev/null
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST" <<EOF
          set ftp:ssl-allow no
          set ftp:passive-mode on
          set net:max-retries 20
          set net:reconnect-interval-base 3
          set net:timeout 20
          set mirror:parallel-transfer-count 2
          lcd ./out
          cd "$FTP_SERVER_DIR"
          rm -r -f out
          mirror -R --only-newer --parallel=2 --verbose=1 . .
          bye
          EOF
